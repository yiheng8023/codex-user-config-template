name: Audit Codex upstream configuration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Compare with the current official Codex schema
        run: >-
          python -B scripts/audit_codex_upstream.py
          --baseline config/upstream-contract.json
          --config config/common.example.toml
